name: Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: cargo fetch --locked
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: make check
      - run: npm exec playwright install --with-deps chromium
      - run: node tools/ui-smoke.mjs
      - run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: clanzi-linux-amd64
          path: artifacts/
