name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2 patchelf
      - run: npm ci
      - run: cargo fetch --locked
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Check package versions against tag
        id: version
        run: |
          version=$(node tools/release-version.mjs "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --offline --all-targets -- -D warnings
      - run: npm exec playwright install --with-deps chromium
      - run: node tools/ui-smoke.mjs
      - run: make deb
      - run: make appimage
      - name: Verify packages and generate checksums
        working-directory: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          package="clanzi_${VERSION}_amd64.deb"
          appimage="clanzi_${VERSION}_amd64.AppImage"
          test "$(dpkg-deb -f "$package" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          test -x "$appimage"
          "./$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/clanzi
          test -f squashfs-root/usr/share/doc/clanzi/LICENSE
          test -f squashfs-root/usr/share/doc/clanzi/THIRD_PARTY_NOTICES.md
          rm -rf squashfs-root
          sha256sum "$package" "$appimage" 70-clanzi.rules clanzi.conf > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: |
            artifacts/clanzi_${{ steps.version.outputs.version }}_amd64.deb
            artifacts/clanzi_${{ steps.version.outputs.version }}_amd64.AppImage
            artifacts/70-clanzi.rules
            artifacts/clanzi.conf
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-amd64
          path: release
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" \
            "clanzi_${VERSION}_amd64.deb" "clanzi_${VERSION}_amd64.AppImage" \
            70-clanzi.rules clanzi.conf SHA256SUMS \
            --verify-tag --generate-notes --title "clanzi $RELEASE_TAG"
