[package]
name = "clanzi-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Linux key mapping runtime for Ulanzi Vibe Key (AU05)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "clanzi-validate"
path = "src/bin/validate.rs"
