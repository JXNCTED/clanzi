[package]
name = "clanzi"
version = "0.1.0"
edition = "2021"
description = "Olanzi Linux desktop key mapper"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clanzi-core = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
